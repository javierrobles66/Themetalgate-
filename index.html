<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Metal Gate International</title>
<meta name="description" content="The Metal Gate International — international metals trading focused on gold, copper and strategic metals.">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#07131d}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
main{min-height:100svh;position:relative;display:flex;align-items:flex-end;justify-content:center;background-color:#07131d;background-image:url(F9543DD8-BADC-4777-A751-6613CCD68268.PNG);background-position:center center;background-size:cover;background-repeat:no-repeat}
main:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(3,10,16,.72) 100%);pointer-events:none}
.notice{position:relative;z-index:1;margin:0 18px max(24px,env(safe-area-inset-bottom));padding:13px 20px;border:1px solid rgba(213,161,63,.55);background:rgba(5,17,27,.78);backdrop-filter:blur(8px);text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#f1d493;border-radius:3px}
@media(max-width:700px){
  body{background:#000}
  main{
    min-height:0;

height:100vw;
aspect-ratio:1 / 1;


background-size:100% auto;

background-position:center top;
background-repeat:no-repeat;
}
  .notice{
    position:absolute;
    left:50%;
    bottom:max(20px,env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:max-content;
    max-width:calc(100% - 36px);
    margin:0;
    font-size:10px;
    letter-spacing:.1em;
    padding:11px 14px;
  }
}
</style>
</head>
<body><main aria-label="The Metal Gate International"></main></body>
</html>
